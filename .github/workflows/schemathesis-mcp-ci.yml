name: schemathesis-mcp CI

on:
  push:
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/schemathesis-mcp
    strategy:
      fail-fast: false
      matrix:
        schemathesis:
          - "schemathesis==4.21.10"
          - "schemathesis>=4.21,<5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --no-sources
      - run: uv pip install --upgrade "${{ matrix.schemathesis }}"
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv build

  restscope-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv sync --project services/schemathesis-mcp
      - run: uv run pytest -q tests/test_schemathesis_mcp_contract.py
