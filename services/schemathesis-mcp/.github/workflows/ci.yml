name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        schemathesis:
          - "schemathesis==4.21.10"
          - "schemathesis>=4.21,<5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --no-sources
      - run: uv pip install --upgrade "${{ matrix.schemathesis }}"
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv build
