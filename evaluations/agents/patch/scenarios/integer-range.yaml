scenario_id: patch-integer-range
title: Build an integer Generator bounded from 3 through 100
provenance:
  kind: trace
  source: restscope-project-swagger-smoke-20260727T010238Z-9712a1cf/spans-complete.json
  trace_id: bc870e1e64d11b290a11c70fb497a01c
  span_ids: []
  rationale: The source run repeatedly attempted bounded identifier Generators.
tags: [acceptance, integer]
input:
  task:
    todo_id: patch-range
    failure: Project identifiers outside the supported range are rejected.
    root_cause: path.projectId generates integers outside 3 through 100.
    affected_inputs: [path.projectId]
    desired_behavior: Generate integer project identifiers from 3 through 100 inclusive.
    acceptance_criteria: Every generated path.projectId is an integer >= 3 and <= 100.
    prior_attempts: []
  config:
    operation_key: GET /projects/{projectId}
    snapshot:
      operation_key: GET /projects/{projectId}
      method: GET
      path: "/projects/{projectId}"
      parameters:
        - input_node_id: path/projectId
          name: projectId
          location: path
          required: true
      input_nodes:
        - input_node_id: path/projectId
          node_kind: parameter
          canonical_path: path/projectId
          required: true
          schema_contract: {type: integer, minimum: 1, maximum: 999999}
    configs:
      - input_node_id: path/projectId
        inclusion_probability: 1
        strategy: {type: integer_range, minimum: 1, maximum: 999999}
  case_count: 5
expected:
  status: validated
  generators:
    - input_handle: path.projectId
      strategy_type: integer_range
      minimum: 3
      maximum: 100
