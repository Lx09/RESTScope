scenario_id: patch-preserve-prior-failure
title: Replace a Generator without regressing an earlier failure
provenance:
  kind: trace
  source: restscope-project-swagger-smoke-20260727T010238Z-9712a1cf/spans-complete.json
  trace_id: bc870e1e64d11b290a11c70fb497a01c
  span_ids: []
  rationale: The source run proposed replacements for parameters patched in prior rounds.
tags: [history]
input:
  task:
    todo_id: patch-preserve-history
    failure: Values above 50 are rejected by the current endpoint.
    root_cause: path.projectId still generates values greater than 50.
    affected_inputs: [path.projectId]
    desired_behavior: Limit values to 50 without reintroducing values below 3.
    acceptance_criteria: Every value is an integer from 3 through 50 inclusive.
    prior_attempts:
      - input_handle: path.projectId
        failures:
          - summary: Values below 3 were rejected in an earlier round.
            attempts:
              - outcome: applied_patch
                root_cause: the previous Generator included 1 and 2
                reason: keep the Generator minimum at 3
                generator_change:
                  generator_changes:
                    - action: update
                      input_node_id: path/projectId
                      after:
                        strategy: {type: integer_range, minimum: 3, maximum: 100}
                  after_generators:
                    path.projectId:
                      strategy: {type: integer_range, minimum: 3, maximum: 100}
  config:
    operation_key: GET /projects/{projectId}
    snapshot:
      operation_key: GET /projects/{projectId}
      method: GET
      path: "/projects/{projectId}"
      parameters:
        - input_node_id: path/projectId
          name: projectId
          location: path
          required: true
      input_nodes:
        - input_node_id: path/projectId
          node_kind: parameter
          canonical_path: path/projectId
          required: true
          schema_contract: {type: integer, minimum: 1, maximum: 999999}
    configs:
      - input_node_id: path/projectId
        inclusion_probability: 1
        strategy: {type: integer_range, minimum: 3, maximum: 100}
  case_count: 5
expected:
  status: validated
  generators:
    - input_handle: path.projectId
      strategy_type: integer_range
      minimum: 3
      maximum: 50
