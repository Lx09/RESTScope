scenario_id: resolution-merge-shared-parameter
title: Merge distinct messages caused by the same body parameter
provenance:
  kind: trace
  source: artifacts/phoenix-exports/restscope-project-swagger-smoke-20260727T010238Z-9712a1cf
  trace_id: sanitized-project-create
  span_ids: [sanitized-plan]
  rationale: Two project-create errors varied in wording but implicated the name input.
tags: [acceptance, semantic-grouping]
input:
  request:
    operation_key: POST /projects
    round_number: 1
    batch_run_id: eval-resolution-merge
    case_ids: [TC1, TC2]
  openapi:
    openapi: 3.0.3
    info: {title: Resolution evaluation, version: "1"}
    paths:
      /projects:
        post:
          requestBody:
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    name: {type: string}
                    namespace_id: {type: integer}
          responses: {"400": {description: bad request}}
  catalog_cases:
    - request: {path: {}, query: {}, header: {}, cookie: {}, body: {name: existing}}
      response_body: {message: name already exists}
      failure:
        kind: http
        status_code: 400
        messages: ["HTTP 400: name already exists"]
    - request: {path: {}, query: {}, header: {}, cookie: {}, body: {name: reserved}}
      response_body: {message: name conflicts}
      failure:
        kind: http
        status_code: 409
        messages: ["HTTP 409: name conflicts"]
expected:
  status: completed
  item_count: 1
  source_groups: [[E1, E2]]
  parameter_sets: [[body.name]]
  decision_outcomes: [no_patch]
  applied_candidate_count: 0
