[project]
name = "restscope"
version = "0.1.0"
description = "OpenAPI and Swagger parser utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "packaging>=25.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "mcp>=1.0.0",
    "rstr>=3.2.2,<4",
]

[project.optional-dependencies]
tracing = [
    "arize-phoenix-otel>=0.16.1,<0.17",
]
ui = [
    "starlette>=0.47,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
evaluation = [
    "arize-phoenix-client>=2.13,<3",
    "arize-phoenix-evals>=3,<4",
    "arize-phoenix-otel>=0.16.1,<0.17",
]

[tool.setuptools.packages.find]
include = ["restscope*"]

[tool.setuptools.package-data]
"restscope.ui" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as requiring LLM env vars (deselect with '-m \"not integration\"')",
    "live_e2e: marks destructive tests requiring the configured live API and Phoenix",
    "phoenix_contract: marks tests requiring the local Phoenix Docker service",
]
